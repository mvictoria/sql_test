[project]
name = "sql-test"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "nicegui>=4.0.0",
    "sqlglot>=30.33.0",
    "tomlkit>=0.15.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "prek>=0.5.11",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
]

[project.scripts]
sql-test = "sql_test.integrations.cli:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/fixtures"
asyncio_mode = "auto"
main_file = ""
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tests"]

[tool.sqlfluff.core]
dialect = "duckdb"
