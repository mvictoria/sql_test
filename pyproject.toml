[project]
name = "sql-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.1",
    "sqlglot>=30.33.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/fixtures"
