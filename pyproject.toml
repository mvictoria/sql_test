[project]
name = "sql-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.1",
    "sqlglot>=30.33.0",
]

[dependency-groups]
dev = [
    "prek>=0.5.11",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/fixtures"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tests"]

[tool.sqlfluff.core]
dialect = "duckdb"
