name: CI

"on":
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked

      - name: Checks
        if: matrix.python-version == '3.15'
        run: uv run prek run --all-files

      - name: Pytest
        run: uv run pytest

      - name: Fixture repository tests
        run: uv run pytest -p no:cacheprovider tests/fixtures/repos/lakehouse-data-customer/tests

  sample-data-tests:
    uses: ./.github/workflows/data-tests.yml
    with:
      working-directory: tests/fixtures/repos/lakehouse-data-customer
