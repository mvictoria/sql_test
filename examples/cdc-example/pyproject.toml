[project]
name = "cdc-example"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "sql-test @ git+https://github.com/mvictoria/sql_test.git@v0",
    "pytest>=9",
]

[tool.uv]
package = false

[tool.sql-test]
sqls = "admin/sqls"
mapping = "admin/config/lookup_sql_table_mapping.csv"
schemas = "admin/sqls"
cases = "tests/cases"
