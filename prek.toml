#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --fix", language = "system", types = ["python"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types = ["python"] },
    { id = "sqlfluff", name = "sqlfluff fix", entry = "uv run sqlfluff fix", language = "system", types = ["sql"] },
    { id = "pyrefly", name = "pyrefly check", entry = "uv run pyrefly check", language = "system", types = ["python"], pass_filenames = false },
]
